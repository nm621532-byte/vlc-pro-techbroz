<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131313">
<title>VLC Clone – Video Player (Tech Bro Z)</title>
<meta name="description" content="A VLC for Android style video player that runs in your phone's browser. Add videos, real thumbnails, gestures, playlists, subtitles, equalizer. Educational clone by Tech Bro Z, not affiliated with VideoLAN.">
<meta property="og:title" content="VLC Clone – Video Player (Tech Bro Z)">
<meta property="og:description" content="Phone pe chalne wala VLC jaisa video player: videos add karo, thumbnails, gestures, playlists, subtitles, equalizer. All data stays on your phone.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M13 3h6l6 22H7z' fill='%23ff8800'/%3E%3Cpath d='M11.6 11h8.8l1.2 4.4H10.4zM9.5 19h13l1.1 4H8.4z' fill='%23fff'/%3E%3Crect x='4' y='25' width='24' height='4' rx='1.5' fill='%23ff8800'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i></div>
<div id="app">
  <div id="statusbar" aria-hidden="true"></div>

  <header id="toolbar">
    <div class="tb-main">
      <button id="tbBack" class="icon-btn hidden" aria-label="Back"></button>
      <span id="logo" aria-hidden="true"></span>
      <h1 id="tbTitle">VLC</h1>
      <button id="btnSearch" class="icon-btn tb-ic" aria-label="Search"></button>
      <button id="btnResume" class="icon-btn tb-ic" aria-label="Resume last played"></button>
      <button id="btnMenu" class="icon-btn tb-ic" aria-label="More options"></button>
    </div>
    <div class="tb-search hidden">
      <button id="searchBack" class="icon-btn" aria-label="Close search"></button>
      <input id="searchInput" type="search" placeholder="Search videos" autocomplete="off" enterkeyhint="search">
      <button id="searchClear" class="icon-btn" aria-label="Clear"></button>
    </div>
  </header>

  <nav id="tabs" role="tablist"></nav>

  <main id="content" tabindex="-1"></main>

  <div id="mini" class="hidden" role="region" aria-label="Mini player">
    <div class="mini-thumb"></div>
    <div class="mini-text"><div class="mini-title"></div><div class="mini-sub"></div></div>
    <button class="icon-btn mini-play" aria-label="Play or pause"></button>
    <button class="icon-btn mini-close" aria-label="Close"></button>
    <div class="mini-prog"><i></i></div>
  </div>

  <button id="fab" aria-label="Play"></button>

  <nav id="bottomnav">
    <button data-nav="video" class="active"><span class="ni"></span><span class="nl">Video</span></button>
    <button data-nav="audio"><span class="ni"></span><span class="nl">Audio</span></button>
    <button data-nav="browse"><span class="ni"></span><span class="nl">Browse</span></button>
    <button data-nav="playlists"><span class="ni"></span><span class="nl">Playlists</span></button>
    <button data-nav="more"><span class="ni"></span><span class="nl">More</span></button>
  </nav>
  <div id="homebar" aria-hidden="true"><i></i></div>
</div>

<!-- Full screen player -->
<section id="player" class="hidden" aria-label="Video player">
  <div id="stage"><video id="pv" playsinline preload="auto"></video><div id="audioArt" class="hidden"></div></div>
  <div id="gest"></div>
  <div id="subLine" aria-live="off"></div>
  <div id="ind" class="hidden"><span class="ind-ic"></span><div class="ind-bar"><i></i></div><span class="ind-txt"></span></div>
  <div id="seekHint" class="hidden"></div>
  <div id="dblL" class="dbl">«&nbsp;10s</div><div id="dblR" class="dbl">10s&nbsp;»</div>
  <div id="pctl">
    <div class="p-top glass">
      <button id="pBack" class="icon-btn" aria-label="Close player"></button>
      <div class="p-titles"><div id="pTitle"></div><div id="pSub"></div></div>
      <button id="pSubs" class="icon-btn" aria-label="Subtitles"></button>
      <button id="pMore" class="icon-btn" aria-label="Player options"></button>
    </div>
    <div class="p-badges"><span id="bAB" class="badge hidden"></span><span id="bLoop" class="badge hidden"></span><span id="bSleep" class="badge hidden"></span><span id="bEq" class="badge hidden"></span></div>
    <div class="p-mid">
      <button id="pPrev" class="icon-btn big" aria-label="Previous"></button>
      <button id="pRew" class="icon-btn big" aria-label="Back 10 seconds"></button>
      <button id="pPlay" class="icon-btn huge glass" aria-label="Play or pause"></button>
      <button id="pFwd" class="icon-btn big" aria-label="Forward 10 seconds"></button>
      <button id="pNext" class="icon-btn big" aria-label="Next"></button>
    </div>
    <div class="p-bottom glass">
      <div class="p-seekrow"><span id="pCur">0:00</span><input id="pSeek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek"><span id="pDur">0:00</span></div>
      <div class="p-btnrow">
        <button id="pLock" class="icon-btn" aria-label="Lock controls"></button>
        <button id="pRotate" class="icon-btn" aria-label="Rotate"></button>
        <button id="pAspect" class="icon-btn" aria-label="Aspect ratio"></button>
        <button id="pSpeed" class="pill-btn" aria-label="Playback speed">1x</button>
        <button id="pLoop" class="icon-btn" aria-label="Loop"></button>
        <button id="pShot" class="icon-btn" aria-label="Screenshot"></button>
        <button id="pPip" class="icon-btn" aria-label="Picture in picture"></button>
        <button id="pFull" class="icon-btn" aria-label="Fullscreen"></button>
      </div>
    </div>
  </div>
  <button id="pUnlock" class="icon-btn glass hidden" aria-label="Unlock"></button>
</section>

<div id="sheetWrap" class="hidden"><div id="scrim"></div><div id="sheet" class="glass" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="hidden" role="status"></div>
<input id="fileVideo" type="file" accept="video/*,.mkv,.avi,.mov,.webm,.3gp" multiple hidden>
<input id="fileAudio" type="file" accept="audio/*,.mp3,.m4a,.aac,.ogg,.opus,.wav,.flac" multiple hidden>
<input id="fileSub" type="file" accept=".srt,.vtt,text/vtt,application/x-subrip" hidden>
<input id="fileRelink" type="file" accept="video/*,audio/*" hidden>
<script src="app.js"></script>
</body>
</html>
